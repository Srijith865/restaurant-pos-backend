<style>

<body class="flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Login Container -->
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Header Branding -->
<div class="mb-12 flex flex-col items-center text-center">
<div class="mb-6">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'wght' 300;">
                    restaurant
                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight mb-2">
                Bluefox POS
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">
                Sign in to continue
            </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" id="login-form">
<!-- Waiter Name Selector -->
<div class="relative group">
<div class="absolute -top-2 left-3 bg-background px-1 z-10">
<label class="font-label-md text-label-md text-on-surface-variant" for="waiter-select">WAITER NAME</label>
</div>
<div class="relative flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest transition-all duration-200 input-glow focus-within:border-primary">
<select class="w-full appearance-none bg-transparent py-4 pl-4 pr-10 font-body-md text-body-md text-on-surface focus:outline-none cursor-pointer" id="waiter-select">
<option disabled="" selected="" value="">Select your name</option>
<option value="venkataramana">Venkataramana</option>
<option value="rahul">Rahul Sharma</option>
<option value="priya">Priya Singh</option>
<option value="ananya">Ananya Iyer</option>
</select>
<div class="absolute right-3 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
<!-- 4-Digit PIN Input -->
<div class="relative group">
<div class="absolute -top-2 left-3 bg-background px-1 z-10">
<label class="font-label-md text-label-md text-on-surface-variant" for="pin-input">4-DIGIT PIN</label>
</div>
<div class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest transition-all duration-200 input-glow focus-within:border-primary overflow-hidden">
<input class="w-full bg-transparent py-4 px-4 font-body-lg text-body-lg text-on-surface placeholder-outline focus:outline-none tracking-[1em]" id="pin-input" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="••••" type="password">
<div class="pr-4 flex items-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm py-4 rounded-xl shadow-md transition-all duration-300 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                Sign In
            </button>
</form>
<!-- Footer / Technical Info -->
<footer class="mt-16 text-center">

</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const pinInput = document.getElementById('pin-input');
            const submitBtn = form.querySelector('button');

            // Prevent non-numeric characters in PIN
            pinInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Visual feedback
                submitBtn.innerHTML = `
                    <div class="flex items-center justify-center space-x-2">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Authenticating...</span>
                    </div>
                `;
                submitBtn.disabled = true;

                // Simulate login delay
                setTimeout(() => {
                    if (pinInput.value.length === 4) {
                        submitBtn.classList.replace('bg-primary', 'bg-emerald-600');
                        submitBtn.innerHTML = 'Welcome Back';
                        console.log('Login Successful');
                    } else {
                        submitBtn.classList.replace('bg-primary', 'bg-error');
                        submitBtn.innerHTML = 'Invalid PIN';
                        submitBtn.disabled = false;
                        setTimeout(() => {
                            submitBtn.classList.replace('bg-error', 'bg-primary');
                            submitBtn.innerHTML = 'Sign In';
                        }, 2000);
                    }
                }, 1200);
            });
        });
    </script>
