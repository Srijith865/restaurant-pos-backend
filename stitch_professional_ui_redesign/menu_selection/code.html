<style>
        body {

        }

            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-shadow {
            border: 1px solid #E2E8F0;
        }
        .active-pill {

<body class="flex flex-col min-h-screen">
<!-- Top AppBar - Following JSON Structure -->
<header class="bg-surface docked full-width top-0 border-b border-outline-variant flex justify-between items-center px-margin-mobile py-sm w-full sticky z-40">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Table 4</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="p-2 hover:bg-surface-container-low rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-error">delete</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow overflow-y-auto pb-[280px]">
<!-- Search Bar Section -->
<div class="px-margin-mobile pt-6 pb-4">
<div class="relative group">
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 pl-11 font-body-md text-on-surface outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all" placeholder="Search items..." type="text">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary">search</span>
</div>
</div>
<!-- Categories Section -->
<div class="flex overflow-x-auto custom-scrollbar px-margin-mobile gap-3 py-2 mb-6">
<button class="whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md active-pill transition-colors shadow-sm">
                BAGARA RICE COMBOS
            </button>
<button class="whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-white border border-outline-variant text-on-surface-variant hover:border-primary transition-colors">
                BREADS &amp; ROTIS
            </button>
<button class="whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-white border border-outline-variant text-on-surface-variant hover:border-primary transition-colors">
                APPETIZERS
            </button>
<button class="whitespace-nowrap px-6 py-2 rounded-full font-label-md text-label-md bg-white border border-outline-variant text-on-surface-variant hover:border-primary transition-colors">
                DESSERTS
            </button>
</div>
<!-- Menu Item Grid -->
<div class="px-margin-mobile grid grid-cols-2 gap-gutter">
<!-- Item 1 -->
<div class="bg-white p-4 rounded-xl card-shadow flex flex-col justify-between h-[160px] relative group hover:shadow-md transition-all">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-1 uppercase">Dalcha Mutton</h3>
<p class="font-label-md text-label-md text-on-surface-variant">(Bagara Rice)</p>
</div>
<div class="flex justify-between items-end">
<span class="font-headline-sm text-headline-sm text-primary">₹600</span>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Item 2 -->
<div class="bg-white p-4 rounded-xl card-shadow flex flex-col justify-between h-[160px] relative group hover:shadow-md transition-all">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-1 uppercase">Koramenu Pulusu</h3>
<p class="font-label-md text-label-md text-on-surface-variant">(Bagara Rice)</p>
</div>
<div class="flex justify-between items-end">
<span class="font-headline-sm text-headline-sm text-primary">₹480</span>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Item 3 (Additional for context) -->
<div class="bg-white p-4 rounded-xl card-shadow flex flex-col justify-between h-[160px] relative group hover:shadow-md transition-all">
<div>

<p class="font-label-md text-label-md text-on-surface-variant">(Butter Special)</p>
</div>
<div class="flex justify-between items-end">
<span class="font-headline-sm text-headline-sm text-primary">₹80</span>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Item 4 (Additional for context) -->

<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface leading-tight mb-1 uppercase">Mutton Biryani</h3>
<p class="font-label-md text-label-md text-on-surface-variant">(Classic Hyderabadi)</p>
</div>
<div class="flex justify-between items-end">
<span class="font-headline-sm text-headline-sm text-primary">₹450</span>
<button class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white active:scale-90 transition-transform shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">add</span>
</button>

</div>

<!-- Current Order Bottom Sheet -->
<section class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white rounded-t-[32px] z-50 px-margin-mobile pt-6 pb-8 border-t border-outline-variant">
<!-- Handle for visual cue -->

<div class="flex justify-between items-center mb-6">

<button class="text-primary font-label-md text-label-md hover:underline decoration-2 underline-offset-4 transition-all">View Sent (2)</button>
</div>
<!-- Order Items Placeholder / Empty Space as per layout -->
<div class="h-12 w-full mb-6 border-b border-outline-variant/50"></div>
<div class="flex justify-between items-center mb-8">
<span class="font-headline-sm text-headline-sm text-on-surface">Total Amount</span>
<span class="font-headline-md text-headline-md text-primary font-extrabold">₹400</span>
</div>
<button class="w-full bg-[#82a39b] hover:bg-primary text-white font-headline-sm text-headline-sm py-4 rounded-xl transition-all duration-300 shadow-lg active:scale-[0.98] disabled:opacity-50" id="sendToKitchen">
            Send to Kitchen
        </button>
</section>
<!-- Minimal Overlay for Desktop Previews -->
<div class="hidden md:flex fixed top-0 right-0 w-80 h-screen bg-surface-container-low border-l border-outline-variant p-6 flex-col">
<h4 class="font-label-md text-label-md text-outline uppercase tracking-widest mb-6">Staff Info</h4>
<div class="flex items-center gap-4 mb-10">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary font-bold">V</div>
<div>

<p class="font-label-md text-label-md text-on-surface-variant">Head Waiter • Morning Shift</p>
</div>
</div>
<div class="space-y-4">
<div class="p-4 rounded-xl bg-white border border-outline-variant">
<p class="font-label-md text-label-md text-outline uppercase mb-1">Status</p>
<p class="font-body-md text-body-md font-bold text-primary flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary"></span> Occupied
                </p>
</div>
<div class="p-4 rounded-xl bg-white border border-outline-variant">
<p class="font-label-md text-label-md text-outline uppercase mb-1">Cover</p>
<p class="font-body-md text-body-md font-bold text-on-surface">4 Persons</p>
</div>
</div>
</div>
<script>
        // Simple Interaction logic
        document.addEventListener('DOMContentLoaded', () => {
            const sendButton = document.getElementById('sendToKitchen');
            
            sendButton.addEventListener('click', () => {
                const originalText = sendButton.innerHTML;
                sendButton.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Sending...';
                sendButton.classList.add('bg-primary');
                
                setTimeout(() => {
                    sendButton.innerHTML = '<span class="material-symbols-outlined">check</span> Sent Successfully';
                    setTimeout(() => {
                        sendButton.innerHTML = originalText;
                        sendButton.classList.remove('bg-primary');
                    }, 2000);
                }, 1500);
            });

            // Handle bottom sheet subtle bounce on click of content
            const items = document.querySelectorAll('.grid > div');
            items.forEach(item => {
                item.addEventListener('click', () => {
                    const sheet = document.querySelector('.bottom-sheet');
                    sheet.classList.add('-translate-y-2');
                    setTimeout(() => sheet.classList.remove('-translate-y-2'), 150);
                });
            });
        });
    </script>
</body></html>
